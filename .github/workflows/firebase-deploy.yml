name: Deploy to Firebase on Push to firebase Branch

on:
  push:
    branches:
      - firebase

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.web file
        run: |
          cat << 'EOF' > .env.web
          ${{ secrets.ENV_WEB }}
          EOF

      - name: Build Web Application
        run: npm run build:web

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENMORY_21593 }}

      - name: Deploy to Firebase (Hosting & Firestore)
        run: npx firebase-tools deploy --project enmory-21593 --non-interactive
