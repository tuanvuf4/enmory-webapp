name: Deploy to Firebase on Push to firebase Branch

on:
  push:
    branches:
      - firebase

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.web file
        run: |
          cat << 'EOF' > .env.web
          ${{ secrets.ENV_WEB }}
          EOF

      - name: Build Web Application
        run: npm run build:web

      - name: Deploy to Firebase Hosting & Firestore
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENMORY_21593 }}
          channelId: live
          projectId: enmory-21593
